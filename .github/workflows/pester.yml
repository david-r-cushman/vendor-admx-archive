name: Pester Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Pester
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7 -or $PSVersionTable.PSVersion.Minor -ne 6) {
            throw "Expected PowerShell 7.6.x, found $($PSVersionTable.PSVersion)."
          }
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default -ErrorAction Stop
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force

      - name: Validate template version
        shell: pwsh
        run: ./scripts/Test-TemplateVersion.ps1

      - name: Run tests
        shell: pwsh
        run: ./scripts/Invoke-Tests.ps1
